services:
  - type: worker
    name: refinder-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    disk:
      name: refinder-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: YOUTUBE_COOKIES
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: DOWNLOAD_DIR
        value: /data/downloads/
      - key: DATABASE_FILE
        value: /data/telemusic.db
      - key: CACHE_DB_FILE
        value: /data/telegram_bot_cache.json
